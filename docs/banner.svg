<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="858" height="258" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">automerge-lens: explaining why a CRDT merge resolved the way it did</text>

  <rect x="40" y="60" width="170" height="50" rx="8" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="125" y="80" text-anchor="middle" font-size="10" fill="#0b3d91">replica A</text>
  <text x="125" y="95" text-anchor="middle" font-size="10" fill="#0b3d91">title: "Draft v1"</text>

  <rect x="40" y="130" width="170" height="50" rx="8" fill="#fbf1ff" stroke="#8250df"/>
  <text x="125" y="150" text-anchor="middle" font-size="10" fill="#4b2a7a">replica B</text>
  <text x="125" y="165" text-anchor="middle" font-size="10" fill="#4b2a7a">title: "Draft v2"</text>

  <path d="M210 85 C 260 85, 260 120, 320 120" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arrow7)"/>
  <path d="M210 155 C 260 155, 260 120, 320 120" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arrow7)"/>

  <rect x="320" y="90" width="210" height="60" rx="8" fill="#fff7e6" stroke="#d4a017"/>
  <text x="425" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#7a5200">merge -&gt; conflict at "title"</text>
  <text x="425" y="130" text-anchor="middle" font-size="10" fill="#334">Automerge picks one, keeps both</text>

  <path d="M530 120 H600" stroke="#57606a" stroke-width="2" marker-end="url(#arrow7)"/>

  <rect x="600" y="80" width="210" height="80" rx="8" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="705" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#0b3d91">explainConflicts(doc)</text>
  <text x="705" y="120" text-anchor="middle" font-size="10" fill="#334">winner: "Draft v2" (replica B)</text>
  <text x="705" y="134" text-anchor="middle" font-size="10" fill="#334">lost: "Draft v1" (replica A)</text>
  <text x="705" y="148" text-anchor="middle" font-size="10" fill="#334">walks the whole doc, not one key</text>

  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#57606a">Plus checkConvergence(): fuzzes application order across shuffled changes</text>
  <text x="430" y="218" text-anchor="middle" font-size="11" fill="#57606a">to verify the convergence guarantee actually held -- not just assumed.</text>

  <defs>
    <marker id="arrow7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
